<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="profile-card">
      <div class="cover"></div>
      <div class="avatar" aria-label="Olivia Brooks initials">MSH</div>
      <section class="content">
        <h1>Mohammad Shafiq Hamidee</h1>
        <p class="role">Product Designer · Afghanistan</p>
        <p class="bio">a web developer</p>

        <div class="stats" aria-label="Profile statistics">
          <div><strong>1.2K</strong><span>Followers</span></div>
          <div><strong>248</strong><span>Following</span></div>
          <div><strong>42</strong><span>Projects</span></div>
        </div>

        <div class="actions">
          <button class="follow" type="button">Follow</button>
          <button class="message" type="button">Message</button>
        </div>
      </section>
    </main>
  </body>
</html>
